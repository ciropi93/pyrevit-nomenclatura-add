name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest pyflakes
      - run: python -m pyflakes lib tests
      - run: python -m pytest -q tests

  # pyRevit esegue gli script con IronPython 2.7: Python 2.7 e' il riferimento piu' vicino
  # disponibile in CI (stesse regole su unicode, sintassi e librerie standard).
  test-py27:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sintassi e test con Python 2.7
        run: |
          docker run --rm -v "$PWD":/src -w /src python:2.7-slim sh -c '
            set -e
            find lib "CDV Tools.tab" startup.py -name "*.py" | while IFS= read -r f; do
              python -c "import sys; compile(open(sys.argv[1]).read(), sys.argv[1], \"exec\")" "$f"
            done
            pip install -q "pytest<5"
            python -m pytest -q -p no:cacheprovider tests
          '
