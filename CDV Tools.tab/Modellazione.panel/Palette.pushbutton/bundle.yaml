title: "Personalizza\nPalette"
tooltip: Sceglie quali tasti compaiono nella palette contestuale per ogni categoria (muri, porte, finestre, linee, viste in tavola...). Si può copiare la scelta di una categoria su tutte, ripristinare i predefiniti e accendere o spegnere la palette. Le modifiche valgono subito, senza riavviare.
author: CDV Tools
