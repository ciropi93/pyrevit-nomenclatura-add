title: "Palette\nOn/Off"
tooltip: Accende o spegne la palette contestuale che compare accanto al cursore quando selezioni qualcosa (comandi di modifica, selezione rapida, visibilità e strumenti CDV), compresi i tasti in sovraimpressione e le lettere E/I dei muri. Lo stato resta salvato anche dopo il riavvio di Revit.
author: CDV Tools
