title: "Aggiorna Modello\nda Vista"
tooltip: Aggiorna un Modello di Vista esistente (o ne crea uno nuovo) con le impostazioni grafiche, i filtri e le sovrascritture della vista corrente. Consente di sperimentare modifiche grafiche a modello sganciato e salvarle nel modello di vista scelto.
