title: "Aggiorna Modello\nda Vista"
tooltip: "Salva nel modello di vista la grafica della vista attiva. Se la vista usa un modello: Sgancia per modificare. Cambia la grafica, poi rilancia: il modello è già proposto, Aggiorna e la vista si riaggancia. Puoi anche creare un modello nuovo dalla vista."
author: CDV Tools
