title: "Profondità\nSezione"
tooltip: "Sfondo grigio oltre la profondità della sezione attiva o selezionata. Se lo sfondo c'è già, il clic lo sincronizza. Altrimenti (o Maiusc+clic) chiede solo fino a che profondità; la grafica dello sfondo è nelle opzioni avanzate."
