title: "Aggiorna\nFacciata"
tooltip: Riapplica il ritmo salvato alle facciate continue selezionate, per esempio dopo averle stirate o dopo aver cambiato i livelli. Le modifiche fatte a mano a griglie, montanti e pannelli vengono rifatte dal ritmo. Maiusc+clic apre la finestra del ritmo.
