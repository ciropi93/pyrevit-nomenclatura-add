title: "Uniforma Lunghezza Linea al Riferimento"
tooltip: "Copia la lunghezza della linea del titolo da una vista di riferimento alle altre, così le linee dei titoli hanno tutte la stessa lunghezza. Seleziona prima almeno due viste in tavola: una di esse fa da riferimento. Con una sola vista selezionata fa da riferimento e scegli le altre; senza selezione il comando te le chiede. Ctrl+Z annulla."
author: CDV Tools
