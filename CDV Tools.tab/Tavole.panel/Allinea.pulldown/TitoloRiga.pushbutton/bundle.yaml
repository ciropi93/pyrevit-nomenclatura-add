title: "Allinea Titoli in Riga sul Foglio (Y)"
tooltip: "Mette i titoli delle viste esattamente sulla stessa linea orizzontale (stessa Y sul foglio). Seleziona prima almeno due viste in tavola: la più in basso fa da riferimento. Con una sola vista selezionata fa da riferimento e scegli le altre; senza selezione il comando te le chiede. Ctrl+Z annulla."
