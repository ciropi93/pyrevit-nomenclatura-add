title: "Allinea Ritaglio a Sinistra"
tooltip: "Allinea il ritaglio (CropBox) delle viste in tavola, ignorando le annotazioni. Porta il bordo sinistro sul riferimento. Seleziona prima almeno due viste in tavola: la più a sinistra fa da riferimento. Con una sola vista selezionata fa da riferimento e scegli le altre; senza selezione il comando te le chiede. Ctrl+Z annulla."
author: CDV Tools
