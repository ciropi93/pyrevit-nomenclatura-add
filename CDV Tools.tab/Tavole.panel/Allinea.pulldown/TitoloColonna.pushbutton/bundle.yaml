title: "Incolonna Titoli sul Foglio (X)"
tooltip: "Mette i titoli delle viste esattamente sulla stessa verticale (stessa X sul foglio). Seleziona prima almeno due viste in tavola: la più a sinistra fa da riferimento. Con una sola vista selezionata fa da riferimento e scegli le altre; senza selezione il comando te le chiede. Ctrl+Z annulla."
author: CDV Tools
