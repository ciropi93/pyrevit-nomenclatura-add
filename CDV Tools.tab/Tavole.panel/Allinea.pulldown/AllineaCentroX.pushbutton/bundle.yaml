title: "Allinea Ritaglio al Centro (X)"
tooltip: "Allinea il ritaglio (CropBox) delle viste in tavola, ignorando le annotazioni. Porta il centro orizzontale sul riferimento. Seleziona prima almeno due viste in tavola: una di esse fa da riferimento. Con una sola vista selezionata fa da riferimento e scegli le altre; senza selezione il comando te le chiede. Ctrl+Z annulla."
author: CDV Tools
context: doc-project
