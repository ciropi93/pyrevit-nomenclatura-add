title: "Stessa Distanza Verticale sotto il Ritaglio"
tooltip: "Dà ai titoli la stessa distanza verticale dal fondo del ritaglio (CropBox). Seleziona prima almeno due viste in tavola: la più in basso fa da riferimento. Con una sola vista selezionata fa da riferimento e scegli le altre; senza selezione il comando te le chiede. Ctrl+Z annulla."
