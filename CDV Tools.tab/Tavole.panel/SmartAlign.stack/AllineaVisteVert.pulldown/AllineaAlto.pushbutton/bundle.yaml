title: "Allinea Ritaglio in Alto"
tooltip: "Allinea il ritaglio (CropBox) delle viste in tavola, ignorando le annotazioni. Porta il bordo superiore sul riferimento. Seleziona prima almeno due viste in tavola: la più in alto fa da riferimento. Con una sola vista selezionata fa da riferimento e scegli le altre; senza selezione il comando te le chiede. Ctrl+Z annulla."
author: CDV Tools
