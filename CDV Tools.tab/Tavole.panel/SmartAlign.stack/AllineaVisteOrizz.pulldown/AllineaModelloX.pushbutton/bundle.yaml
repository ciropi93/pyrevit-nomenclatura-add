title: "Allinea Coordinate Modello (X)"
tooltip: "Allinea in orizzontale le viste sulle coordinate reali del modello (per esempio una griglia o un filo fisso), così lo stesso punto del fabbricato cade sulla stessa X in tutte le viste. Seleziona prima almeno due viste in tavola: una di esse fa da riferimento. Con una sola vista selezionata fa da riferimento e scegli le altre; senza selezione il comando te le chiede. Ctrl+Z annulla."
author: CDV Tools
