title: "Campitura da\nPolilinea"
tooltip: "Crea una campitura ad offset da linee o polilinee (di dettaglio o di modello): su un lato o centrata, con angoli puliti e stile dei bordi a scelta. Seleziona le linee e clicca: usa le ultime impostazioni. Maiusc+clic (o primo uso): apre la finestra delle impostazioni."
