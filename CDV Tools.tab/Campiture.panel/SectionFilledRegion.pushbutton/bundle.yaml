title: "Campitura per\nsezione"
tooltip: "In sezione o prospetto crea una campitura (es. terreno) dal bordo inferiore o superiore degli elementi sezionati (pavimenti inclinati, tetti, fondazioni, anche da link RVT), chiusa con fondo orizzontale o parallelo alla pendenza. Seleziona gli elementi e clicca: usa le ultime impostazioni. Maiusc+clic (o primo uso): apre la finestra delle impostazioni."
author: CDV Tools
